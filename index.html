<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Connect — Encuentra tu profesional de belleza ideal</title>
    
    <!-- Google Fonts: Poppins (headings) & Open Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3.8 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- JS Logic -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Main Application Wrapper -->
    <div class="main-wrapper">
        <!-- Header / Navigation -->
        <header class="py-4 shadow-sm bg-white mb-4">
            <div class="container d-flex flex-column align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <!-- Elegant Heart Sparkle Logo Icon -->
                    <span class="logo-icon">✨</span>
                    <h1 class="logo m-0">Beauty Connect</h1>
                </div>
                <p class="tagline text-muted mt-1 mb-0">Tu conexión con el mundo de la belleza</p>
            </div>
        </header>

        <main class="container py-3">
            <!-- View 1: Service Category Selection (Home Screen) -->
            <section id="category-view" class="view">
                <div class="text-center mb-5">
                    <h2 class="question h2 font-heading fw-semibold mb-2">¿Qué servicio de belleza buscas hoy?</h2>
                    <p class="text-muted fs-6">Explora profesionales de confianza listos para consentirte</p>
                </div>

                <!-- Category Cards Grid -->
                <div class="row g-4 justify-content-center max-w-cards mx-auto">
                    <!-- Category: Uñas -->
                    <div class="col-12 col-sm-6 col-md-3">
                        <button class="category-card-btn w-100 h-100 border-0 p-0 bg-transparent text-start" data-category="Uñas">
                            <div class="category-card card shadow-sm border-0 h-100">
                                <div class="img-wrapper">
                                    <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=500&q=80" class="card-img-top category-img" alt="Servicio de Uñas">
                                </div>
                                <div class="card-body text-center py-3">
                                    <h3 class="card-title font-heading h5 mb-0">Uñas</h3>
                                    <span class="explore-tag">Explorar profesionales</span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Category: Cabello -->
                    <div class="col-12 col-sm-6 col-md-3">
                        <button class="category-card-btn w-100 h-100 border-0 p-0 bg-transparent text-start" data-category="Cabello">
                            <div class="category-card card shadow-sm border-0 h-100">
                                <div class="img-wrapper">
                                    <img src="https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=500&q=80" class="card-img-top category-img" alt="Servicio de Cabello">
                                </div>
                                <div class="card-body text-center py-3">
                                    <h3 class="card-title font-heading h5 mb-0">Cabello</h3>
                                    <span class="explore-tag">Explorar profesionales</span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Category: Maquillaje -->
                    <div class="col-12 col-sm-6 col-md-3">
                        <button class="category-card-btn w-100 h-100 border-0 p-0 bg-transparent text-start" data-category="Maquillaje">
                            <div class="category-card card shadow-sm border-0 h-100">
                                <div class="img-wrapper">
                                    <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=500&q=80" class="card-img-top category-img" alt="Servicio de Maquillaje">
                                </div>
                                <div class="card-body text-center py-3">
                                    <h3 class="card-title font-heading h5 mb-0">Maquillaje</h3>
                                    <span class="explore-tag">Explorar profesionales</span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Category: Pestañas -->
                    <div class="col-12 col-sm-6 col-md-3">
                        <button class="category-card-btn w-100 h-100 border-0 p-0 bg-transparent text-start" data-category="Pestañas">
                            <div class="category-card card shadow-sm border-0 h-100">
                                <div class="img-wrapper d-flex align-items-center justify-content-center" style="background-color: #FFF0F3;">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width: 80px; height: 80px; fill: none; stroke: #D94F7D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;">
                                        <!-- Upper eyelid -->
                                        <path d="M15,55 Q50,20 85,55" />
                                        <!-- Lower eyelid -->
                                        <path d="M15,55 Q50,80 85,55" opacity="0.3" />
                                        <!-- Pupil -->
                                        <circle cx="50" cy="50" r="10" fill="#D94F7D" stroke="none" />
                                        <!-- Eyelashes (pestañas) -->
                                        <path d="M25,41 L17,28" />
                                        <path d="M35,34 L30,18" />
                                        <path d="M45,31 L45,14" />
                                        <path d="M55,31 L55,14" />
                                        <path d="M65,34 L70,18" />
                                        <path d="M75,41 L83,28" />
                                    </svg>
                                </div>
                                <div class="card-body text-center py-3">
                                    <h3 class="card-title font-heading h5 mb-0">Pestañas</h3>
                                    <span class="explore-tag">Explorar profesionales</span>
                                </div>
                            </div>
                        </button>
                    </div>
                </div>
            </section>

            <!-- View 2: Professionals List (Hidden by default, used for interaction verification) -->
            <section id="professionals-view" class="view d-none">
                <div class="max-w-cards mx-auto">
                    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
                        <button id="back-btn" class="btn btn-back d-inline-flex align-items-center gap-2 shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                            </svg>
                            Volver a categorías
                        </button>
                        <h2 id="selected-category-title" class="font-heading h3 m-0 text-color-primary"></h2>
                    </div>
                    <div id="professionals-grid" class="row g-4 justify-content-center"></div>
                </div>
            </section>
        </main>

        <footer class="text-center py-4 mt-auto border-top">
            <div class="container">
                <p class="mb-1 text-muted">&copy; 2026 Beauty Connect. Conectando profesionales de la belleza.</p>
                <p class="small text-muted mb-0">Encuentra y contacta de forma segura por WhatsApp.</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap 5.3.8 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
